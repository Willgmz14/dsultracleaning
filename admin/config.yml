backend:
  name: git-gateway
  branch: main

# This adds the logo to her Netlify login screen!
logo_url: "/DsLogo.PNG"

# Where images she uploads will be saved in your repository
media_folder: "uploads"
public_folder: "/uploads"

collections:
  - name: "linktree"
    label: "Link Dashboard Settings"
    files:
      - file: "data/links.json"
        label: "Manage Recommended Products"
        name: "links"
        fields:
          - label: "Amazon Affiliates"
            name: "amazon"
            widget: "list"
            fields:
              - {label: "Product Name", name: "text", widget: "string"}
              - {label: "Amazon Link", name: "url", widget: "string"}
              - {label: "Product Image", name: "image", widget: "image", required: false}
