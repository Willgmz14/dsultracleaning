<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D's Ultra Cleaning | Links</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Inter Font for a polished look -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col items-center py-12 px-4 sm:px-6">

    <!-- Central Column Layout -->
    <div class="w-full max-w-md">
        
        <!-- Profile Info Section -->
        <div class="flex flex-col items-center mb-10 text-center">
            <!-- Circular Placeholder Logo -->
            <img src="/DsLogo.PNG" 
                 alt="D's Ultra Cleaning Logo" 
                 class="w-24 h-24 rounded-full object-cover shadow-lg border-4 border-white mb-4 bg-white">
            
            <!-- Handle -->
            <h1 class="text-xl font-bold tracking-tight">@dsultracleaning</h1>
            <p class="text-sm text-slate-500 mt-1 font-medium">Professional Cleaning Services</p>
        </div>

        <!-- Standard Social Links -->
        <div class="space-y-4">
            <!-- Button 1 -->
            <a href="https://docs.google.com/forms/d/e/1FAIpQLSc_9dzdjHchaqCqpdpuexT47hA0OkBqeXq6SaLpXf15n4HW0g/viewform" target="_blank" rel="noopener noreferrer" class="block w-full bg-slate-800 text-white text-center py-4 px-6 rounded-xl font-medium hover:bg-slate-700 hover:-translate-y-0.5 hover:shadow-md transition-all duration-200">
                Book a Cleaning Estimate
            </a>
            
            <!-- Button 2 -->
            <a href="#" class="block w-full bg-slate-800 text-white text-center py-4 px-6 rounded-xl font-medium hover:bg-slate-700 hover:-translate-y-0.5 hover:shadow-md transition-all duration-200">
                Follow us on Instagram
            </a>
            
            <!-- Button 3 -->
            <a href="https://dsultracleaning.com" target="_blank" rel="noopener noreferrer" class="block w-full bg-slate-800 text-white text-center py-4 px-6 rounded-xl font-medium hover:bg-slate-700 hover:-translate-y-0.5 hover:shadow-md transition-all duration-200">
                Visit our Website
            </a>
        </div>

        <!-- Amazon Affiliates Section -->
        <div class="mt-12">
            <h2 class="text-lg font-bold text-center mb-4 tracking-tight">Recommended Products</h2>
            
            <div class="space-y-4">
                <!-- Product Card 1 -->
                <a href="#" class="group flex items-center w-full bg-white border border-slate-200 p-3 rounded-xl hover:shadow-md hover:border-slate-300 transition-all duration-200">
                    <img src="https://placehold.co/100x100/e2e8f0/475569?text=Mop" 
                         alt="O-Cedar Spin Mop" 
                         class="w-16 h-16 object-cover rounded-lg mr-4 border border-slate-100 flex-shrink-0">
                    <span class="font-medium flex-1 text-left text-slate-700 group-hover:text-slate-900 transition-colors">O-Cedar EasyWring Spin Mop</span>
                    <!-- Small chevron arrow indicating it's a link -->
                    <svg class="w-5 h-5 text-slate-400 group-hover:text-slate-600 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                    </svg>
                </a>

                <!-- Product Card 2 -->
                <a href="#" class="group flex items-center w-full bg-white border border-slate-200 p-3 rounded-xl hover:shadow-md hover:border-slate-300 transition-all duration-200">
                    <img src="https://placehold.co/100x100/e2e8f0/475569?text=Vacuum" 
                         alt="Bissell Little Green" 
                         class="w-16 h-16 object-cover rounded-lg mr-4 border border-slate-100 flex-shrink-0">
                    <span class="font-medium flex-1 text-left text-slate-700 group-hover:text-slate-900 transition-colors">Bissell Little Green Pro</span>
                    <!-- Small chevron arrow indicating it's a link -->
                    <svg class="w-5 h-5 text-slate-400 group-hover:text-slate-600 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                    </svg>
                </a>
            </div>
        </div>

    </div>

</body>
</html>
