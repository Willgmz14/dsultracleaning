<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D's Ultra Cleaning | Links</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Inter Font for a polished look -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gradient-to-b from-sky-100 to-slate-50 text-slate-800 min-h-screen flex flex-col items-center py-12 px-4 sm:px-6">

    <!-- Central Column Layout -->
    <div class="w-full max-w-md">
        
        <!-- Profile Info Section (Permanent) -->
        <div class="flex flex-col items-center mb-10 text-center">
            <img src="/DsLogo.PNG" 
                 alt="D's Ultra Cleaning Logo" 
                 class="w-24 h-24 rounded-full object-cover shadow-lg border-4 border-white mb-4 bg-white">
            <h1 class="text-xl font-bold tracking-tight">@dsultracleaning</h1>
            <p class="text-sm text-slate-500 mt-1 font-medium">Professional Cleaning Services</p>
            
            <!-- Contact Info -->
            <div class="mt-3 flex flex-col items-center text-sm font-medium text-slate-600 space-y-1">
                <p>Contact us: <a href="tel:3363076612" class="text-sky-600 hover:text-sky-700 hover:underline transition-colors">336.307.6612</a></p>
                <p><a href="mailto:info@dsultracleaning.com" class="text-sky-600 hover:text-sky-700 hover:underline transition-colors">info@dsultracleaning.com</a></p>
            </div>
        </div>

        <!-- Standard Social Links (Permanent) -->
        <div class="space-y-4">
            <a href="https://docs.google.com/forms/d/e/1FAIpQLSc_9dzdjHchaqCqpdpuexT47hA0OkBqeXq6SaLpXf15n4HW0g/viewform" target="_blank" rel="noopener noreferrer" class="block w-full bg-slate-800 text-white text-center py-4 px-6 rounded-xl font-medium hover:bg-slate-700 hover:-translate-y-0.5 hover:shadow-md transition-all duration-200">
                Book a Cleaning Estimate
            </a>
            <a href="https://www.instagram.com/dsultracleaning/" target="_blank" rel="noopener noreferrer" class="block w-full bg-slate-800 text-white text-center py-4 px-6 rounded-xl font-medium hover:bg-slate-700 hover:-translate-y-0.5 hover:shadow-md transition-all duration-200">
                Follow us on Instagram
            </a>
            <a href="https://www.facebook.com/dsultracleaning/" target="_blank" rel="noopener noreferrer" class="block w-full bg-slate-800 text-white text-center py-4 px-6 rounded-xl font-medium hover:bg-slate-700 hover:-translate-y-0.5 hover:shadow-md transition-all duration-200">
                Follow us on Facebook
            </a>
            <a href="https://dsultracleaning.com" target="_blank" rel="noopener noreferrer" class="block w-full bg-slate-800 text-white text-center py-4 px-6 rounded-xl font-medium hover:bg-slate-700 hover:-translate-y-0.5 hover:shadow-md transition-all duration-200">
                Visit our Website
            </a>
        </div>

        <!-- Extra Dynamic Links (If she adds more in the CMS) -->
        <div id="dynamic-social-links" class="space-y-4 mt-4"></div>

        <!-- Amazon Affiliates Section (Dynamic from CMS) -->
        <div class="mt-12" id="amazon-section" style="display: none;">
            <h2 class="text-lg font-bold text-center mb-4 tracking-tight">Affiliate Links</h2>
            <div class="space-y-4" id="amazon-container">
                <!-- Products will be injected here by JavaScript -->
            </div>
        </div>

    </div>

    <!-- Script to connect to Netlify CMS Data -->
    <script>
        // Fetch the data Vanessa saves in the CMS
        fetch('/data/links.json')
          .then(response => response.json())
          .then(data => {
            
            // 1. Inject extra social links if she adds any beyond the permanent 4
            if (data.socials && data.socials.length > 0) {
                let socialHtml = '';
                data.socials.forEach(link => {
                    socialHtml += `
                    <a href="${link.url}" target="_blank" class="block w-full bg-slate-800 text-white text-center py-4 px-6 rounded-xl font-medium hover:bg-slate-700 hover:-translate-y-0.5 hover:shadow-md transition-all duration-200">
                        ${link.text}
                    </a>`;
                });
                document.getElementById('dynamic-social-links').innerHTML = socialHtml;
            }

            // 2. Inject Amazon Products
            if (data.amazon && data.amazon.length > 0) {
                // Show the section header
                document.getElementById('amazon-section').style.display = 'block';
                
                let amazonHtml = '';
                data.amazon.forEach(item => {
                    amazonHtml += `
                    <a href="${item.url}" target="_blank" class="group flex items-center w-full bg-white border border-slate-200 p-3 rounded-xl hover:shadow-md hover:border-slate-300 transition-all duration-200">
                        ${item.image ? `<img src="${item.image}" alt="${item.text}" class="w-16 h-16 object-cover rounded-lg mr-4 border border-slate-100 flex-shrink-0">` : ''}
                        <span class="font-medium flex-1 text-left text-slate-700 group-hover:text-slate-900 transition-colors">${item.text}</span>
                        <svg class="w-5 h-5 text-slate-400 group-hover:text-slate-600 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                        </svg>
                    </a>`;
                });
                document.getElementById('amazon-container').innerHTML = amazonHtml;
            }
          })
          .catch(error => console.log('No CMS data found yet or error loading.', error));
    </script>
</body>
</html>
